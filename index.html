<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ Realistik Mashina O'yini</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1a2a3a, #0a121c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #1e2f3c, #14232e);
            padding: 20px 25px 22px 25px;
            border-radius: 42px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), inset 0 1px 4px #5e7e92, inset 0 -3px 8px #0b1219;
            border: 1px solid #3c5b6e;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 3px #0a1118, 0 18px 30px rgba(0, 0, 0, 0.7), inset 0 0 30px #00000055;
            background: #1b2b35;
            cursor: none;
        }
        .info-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 8px 0 8px;
            color: #e2f0fa;
            text-shadow: 0 2px 4px black;
            font-weight: 600;
        }
        .score-box {
            background: #0b141c;
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 1.8rem;
            letter-spacing: 2px;
            box-shadow: inset 0 4px 8px #00000088, 0 6px 0 #060b0f;
            color: #b3e0ff;
            font-weight: 700;
            min-width: 120px;
            text-align: center;
        }
        .hint {
            background: #203b4a;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 1rem;
            box-shadow: inset 0 1px 4px #aaccdd33, 0 5px 0 #0b161e;
            color: #c4e2f5;
            font-weight: 500;
        }
        button {
            background: linear-gradient(180deg, #ffb84d, #e69520);
            border: none;
            font-size: 1.3rem;
            font-weight: 800;
            padding: 10px 30px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 7px 0 #a8660e, 0 10px 15px black;
            color: #151f28;
            letter-spacing: 1px;
            transition: 0.05s linear;
            font-family: inherit;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #a8660e, 0 7px 12px black;
        }
        button:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #7a4e16, 0 7px 12px black;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="420" height="620"></canvas>
    <div class="info-panel">
        <div class="score-box">🏁 <span id="scoreDisplay">0</span></div>
        <button id="resetBtn">QAYTA</button>
        <div class="hint">← → / A D</div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const resetBtn = document.getElementById('resetBtn');

        // ---------- O'YIN O'LCHAMLARI ----------
        const LANE_COUNT = 3;
        const ROAD_WIDTH = 320;
        const LEFT_MARGIN = (canvas.width - ROAD_WIDTH) / 2; // 50
        const CAR_WIDTH = 46;
        const CAR_HEIGHT = 76;
        const OBSTACLE_WIDTH = 46;
        const OBSTACLE_HEIGHT = 76;
        const LANE_CENTERS = [
            LEFT_MARGIN + ROAD_WIDTH * (1/6),
            LEFT_MARGIN + ROAD_WIDTH * (3/6),
            LEFT_MARGIN + ROAD_WIDTH * (5/6)
        ];

        // O'yin holati
        let playerLane = 1;
        let playerX = LANE_CENTERS[playerLane] - CAR_WIDTH/2;
        const playerY = canvas.height - CAR_HEIGHT - 20;

        // To'siqlar
        let obstacles = [];
        let score = 0;
        let gameOver = false;

        // Tezlik
        let baseSpeed = 3.8;
        let speedMultiplier = 1.0;
        let frameCounter = 0;
        let spawnInterval = 40;

        let animationId = null;
        let gameActive = true;

        // ---------- YANGILASH ----------
        function resetGame() {
            gameOver = false;
            score = 0;
            scoreSpan.textContent = '0';
            obstacles = [];
            playerLane = 1;
            playerX = LANE_CENTERS[playerLane] - CAR_WIDTH/2;
            baseSpeed = 3.8;
            speedMultiplier = 1.0;
            frameCounter = 0;
            spawnInterval = 40;
            gameActive = true;
            resetBtn.disabled = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            gameLoop();
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * LANE_COUNT);
            const x = LANE_CENTERS[lane] - OBSTACLE_WIDTH / 2;
            obstacles.push({
                x: x,
                y: -OBSTACLE_HEIGHT - 10,
                lane: lane,
                width: OBSTACLE_WIDTH,
                height: OBSTACLE_HEIGHT,
                // Har bir to'siq uchun rang varianti
                color: Math.random() > 0.5 ? '#b03a2e' : '#a93226',
                lightColor: Math.random() > 0.5 ? '#f39c12' : '#e67e22'
            });
        }

        function rectCollide(ax, ay, aw, ah, bx, by, bw, bh) {
            return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
        }

        function update() {
            if (gameOver) return;

            speedMultiplier = 1.0 + Math.min(score / 280, 1.3);
            const currentSpeed = baseSpeed * speedMultiplier;

            // To'siqlarni harakatlantirish
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += currentSpeed;

                if (obs.y > canvas.height + 60) {
                    obstacles.splice(i, 1);
                    if (!gameOver) {
                        score += 10;
                        scoreSpan.textContent = score;
                    }
                }
            }

            // Yangi to'siq
            frameCounter++;
            const dynamicSpawn = Math.max(18, Math.floor(spawnInterval - score / 35));
            if (frameCounter >= dynamicSpawn) {
                spawnObstacle();
                frameCounter = 0;
            }

            // Kollision
            const playerRect = { x: playerX, y: playerY, w: CAR_WIDTH, h: CAR_HEIGHT };
            for (let obs of obstacles) {
                if (rectCollide(playerRect.x, playerRect.y, playerRect.w, playerRect.h,
                                obs.x, obs.y, obs.width, obs.height)) {
                    gameOver = true;
                    gameActive = false;
                    resetBtn.disabled = false;
                    break;
                }
            }
        }

        // ---------- CHIZISH (REALISTIK GRAFIKA) ----------
        function drawCar(x, y, w, h, isPlayer, colorVariant = 0) {
            // Asosiy korpus uchun gradient
            const bodyGrad = ctx.createLinearGradient(x, y, x + w, y + h);
            if (isPlayer) {
                bodyGrad.addColorStop(0, '#2c7ab1');
                bodyGrad.addColorStop(0.4, '#1f5f8b');
                bodyGrad.addColorStop(0.7, '#154a6e');
                bodyGrad.addColorStop(1, '#0e3a57');
            } else {
                // To'siq mashinasi (qizil / to'q qizil)
                bodyGrad.addColorStop(0, colorVariant === 0 ? '#c0392b' : '#a93226');
                bodyGrad.addColorStop(0.5, colorVariant === 0 ? '#922b21' : '#7b241c');
                bodyGrad.addColorStop(1, colorVariant === 0 ? '#641e16' : '#4a1510');
            }

            // Korpus soyasi
            ctx.shadowColor = '#000000aa';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 5;
            ctx.shadowOffsetX = 2;

            // Asosiy tana
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 12);
            ctx.fill();

            // Tana yon tomonlari (yaltiroq effekt)
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;
            ctx.fillStyle = isPlayer ? '#3a8ec9' : (colorVariant === 0 ? '#d44b3a' : '#b53b2a');
            ctx.beginPath();
            ctx.roundRect(x + 3, y + 3, w - 6, 18, 8);
            ctx.fill();

            // Old oyna (qoramtir)
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#1a2632';
            ctx.beginPath();
            ctx.roundRect(x + 7, y + 22, w - 14, 22, 8);
            ctx.fill();
            // Oyna yaltiroqligi
            ctx.fillStyle = '#5b7d94';
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.roundRect(x + 9, y + 24, w - 18, 8, 5);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // Orqa oyna
            ctx.fillStyle = '#1e2b38';
            ctx.beginPath();
            ctx.roundRect(x + 7, y + h - 38, w - 14, 16, 7);
            ctx.fill();

            // Old chiroqlar (sariq)
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#f7dc6f';
            ctx.fillStyle = '#f9e076';
            ctx.beginPath();
            ctx.arc(x + 10, y + 14, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w - 10, y + 14, 6, 0, Math.PI * 2);
            ctx.fill();
            // Chiroq yadrosi
            ctx.shadowBlur = 16;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x + 10, y + 14, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w - 10, y + 14, 3, 0, Math.PI * 2);
            ctx.fill();

            // Orqa chiroqlar (qizil)
            ctx.shadowColor = '#e74c3c';
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath();
            ctx.arc(x + 10, y + h - 12, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + w - 10, y + h - 12, 6, 0, Math.PI * 2);
            ctx.fill();

            // G'ildiraklar (yaxshilangan)
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#000000';
            ctx.shadowOffsetY = 3;
            ctx.fillStyle = '#1c1c1c';
            // oldingi chap
            ctx.beginPath();
            ctx.roundRect(x - 6, y + 20, 8, 20, 5);
            ctx.fill();
            // oldingi o'ng
            ctx.beginPath();
            ctx.roundRect(x + w - 2, y + 20, 8, 20, 5);
            ctx.fill();
            // orqa chap
            ctx.beginPath();
            ctx.roundRect(x - 6, y + h - 46, 8, 22, 5);
            ctx.fill();
            // orqa o'ng
            ctx.beginPath();
            ctx.roundRect(x + w - 2, y + h - 46, 8, 22, 5);
            ctx.fill();

            // G'ildirak gardishlari (yengil kulrang)
            ctx.fillStyle = '#3f4a55';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 2;
            ctx.beginPath();
            ctx.ellipse(x - 2, y + 30, 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + w + 2, y + 30, 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x - 2, y + h - 35, 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + w + 2, y + h - 35, 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Old bamper / panjara
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.roundRect(x + 5, y + h - 12, w - 10, 8, 4);
            ctx.fill();

            // Shadowni tozalash
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.shadowOffsetX = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ---- ASFALT FON ----
            ctx.fillStyle = '#1b2b35';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Yo'l (asfalt) gradient bilan
            const roadGrad = ctx.createLinearGradient(LEFT_MARGIN, 0, LEFT_MARGIN + ROAD_WIDTH, 0);
            roadGrad.addColorStop(0, '#2f404b');
            roadGrad.addColorStop(0.5, '#3a5262');
            roadGrad.addColorStop(1, '#2f404b');
            ctx.fillStyle = roadGrad;
            ctx.shadowColor = '#00000099';
            ctx.shadowBlur = 18;
            ctx.shadowOffsetY = 8;
            ctx.fillRect(LEFT_MARGIN, 0, ROAD_WIDTH, canvas.height);
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // Yo'l chegaralari (oq chiziq)
            ctx.fillStyle = '#e8ecf0';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#aaccdd';
            ctx.fillRect(LEFT_MARGIN - 5, 0, 5, canvas.height);
            ctx.fillRect(LEFT_MARGIN + ROAD_WIDTH, 0, 5, canvas.height);

            // Yo'l markaziy chiziqlari (oq, dash)
            ctx.strokeStyle = '#eef5fa';
            ctx.lineWidth = 6;
            ctx.setLineDash([30, 28]);
            ctx.beginPath();
            for (let i = 1; i <= 2; i++) {
                const lineX = LEFT_MARGIN + (ROAD_WIDTH * i / 3);
                ctx.moveTo(lineX, 0);
                ctx.lineTo(lineX, canvas.height);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // Harakat effekti uchun yorug' chiziqlar
            ctx.fillStyle = '#c8e0ff22';
            const time = Date.now() * 0.06;
            for (let i = 0; i < 16; i++) {
                const y = (time + i * 80) % canvas.height;
                ctx.fillRect(LEFT_MARGIN + 20, y, 6, 45);
                ctx.fillRect(LEFT_MARGIN + ROAD_WIDTH - 26, (y + 40) % canvas.height, 6, 45);
            }

            // Yo'l chetidagi toshlar / chiziqlar
            ctx.fillStyle = '#6c8a9c';
            for (let i = 0; i < 20; i++) {
                const y = (i * 40 + time * 3) % canvas.height;
                ctx.fillRect(LEFT_MARGIN - 12, y, 8, 18);
                ctx.fillRect(LEFT_MARGIN + ROAD_WIDTH + 4, y, 8, 18);
            }

            // ---- TO'SIQLAR (dushman mashinalari) ----
            obstacles.forEach(obs => {
                drawCar(obs.x, obs.y, obs.width, obs.height, false, obs.color === '#b03a2e' ? 0 : 1);
            });

            // ---- O'YINCHI MASHINASI ----
            drawCar(playerX, playerY, CAR_WIDTH, CAR_HEIGHT, true);

            // ---- GAME OVER XABARI ----
            if (gameOver) {
                ctx.font = 'bold 44px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000dd';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 8;
                ctx.fillStyle = '#ff4d4d';
                ctx.fillText('💥 HALOKAT', canvas.width/2, canvas.height/2 - 20);
                ctx.font = 'bold 22px "Segoe UI", sans-serif';
                ctx.fillStyle = '#ffd966';
                ctx.fillText('Qayta urinish uchun tugmani bosing', canvas.width/2, canvas.height/2 + 55);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }

            // Ball (canvasda)
            ctx.font = 'bold 28px "Segoe UI", monospace';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#eaf4fc';
            ctx.shadowColor = '#000000bb';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 3;
            ctx.fillText('🏁 ' + score, 20, 65);
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
        }

        // roundRect polyfill
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            return this;
        };

        // ---------- GAME LOOP ----------
        function gameLoop() {
            if (!gameActive && gameOver) {
                draw();
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            if (!gameOver) {
                update();
            }
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // ---------- BOSHQARUV ----------
        function movePlayer(direction) {
            if (gameOver) return;
            let newLane = playerLane + direction;
            if (newLane >= 0 && newLane < LANE_COUNT) {
                playerLane = newLane;
                playerX = LANE_CENTERS[playerLane] - CAR_WIDTH / 2;
            }
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A' || key === 'ф' || key === 'Ф') {
                e.preventDefault();
                movePlayer(-1);
            } else if (key === 'ArrowRight' || key === 'd' || key === 'D' || key === 'в' || key === 'В') {
                e.preventDefault();
                movePlayer(1);
            } else if (key === 'r' || key === 'R' || key === 'к' || key === 'К') {
                e.preventDefault();
                resetGame();
            }
        });

        resetBtn.addEventListener('click', () => resetGame());

        // Sichqoncha bilan boshqarish
        canvas.addEventListener('click', (e) => {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const clickX = (e.clientX - rect.left) * scaleX;
            let closestLane = 0;
            let minDist = Infinity;
            for (let i = 0; i < LANE_CENTERS.length; i++) {
                const dist = Math.abs(clickX - LANE_CENTERS[i]);
                if (dist < minDist) {
                    minDist = dist;
                    closestLane = i;
                }
            }
            if (closestLane !== playerLane) {
                playerLane = closestLane;
                playerX = LANE_CENTERS[playerLane] - CAR_WIDTH / 2;
            }
        });

        // Arrow scrollingni to'xtatish
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        }, {passive: false});

        // Boshlash
        resetGame();
    })();
</script>
</body>
</html>
